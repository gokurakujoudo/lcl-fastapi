name: Quality

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  platform:
    name: Quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[dev]"
      - run: python -m scripts.quality --collect-coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: |
            .coverage*
            reports/
          include-hidden-files: true
          if-no-files-found: error

  aggregate-coverage:
    needs: platform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: evidence-*
          path: coverage-input
      - run: python -m coverage combine coverage-input/evidence-ubuntu-latest/.coverage coverage-input/evidence-windows-latest/.coverage
      - run: python -m scripts.coverage_report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-coverage
          path: reports/

  build-distributions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install "build>=1.2,<2"
      - run: python -m build
      - run: python -m scripts.artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: current-head-distributions
          path: dist/
          if-no-files-found: error

  downstream-example:
    name: Example ${{ matrix.example }} (${{ matrix.os }})
    needs: build-distributions
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        example: [minimal, composed]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v4
        with:
          name: current-head-distributions
          path: dist/
      - run: python -m scripts.verify_example ${{ matrix.example }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: example-${{ matrix.example }}-${{ matrix.os }}
          path: reports/examples/
          if-no-files-found: error
