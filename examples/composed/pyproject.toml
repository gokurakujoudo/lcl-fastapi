[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lcl-fastapi-composed-example"
version = "1.0.0"
description = "An independent catalog service using lcl-fastapi"
requires-python = ">=3.14"
dependencies = ["lcl-fastapi==0.3.0"]

[tool.hatch.build.targets.wheel]
packages = ["catalog_service"]
