[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lcl-fastapi"
version = "0.3.0"
description = "A lightweight LCL-powered FastAPI service framework"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "gokurakujoudo"}]
dependencies = [
  "lclang==1.0.10",
  "fastapi>=0.141,<0.142",
  "uvicorn>=0.52,<0.53",
  "watchfiles>=1.1,<2",
  "winloop==0.6.3; sys_platform == 'win32'",
  "psutil>=7.2,<8",
  "gunicorn>=26,<27; sys_platform == 'linux'",
]

[project.urls]
Homepage = "https://gokurakujoudo.github.io/lcl-fastapi/"
Documentation = "https://gokurakujoudo.github.io/lcl-fastapi/"
Repository = "https://github.com/gokurakujoudo/lcl-fastapi"
Issues = "https://github.com/gokurakujoudo/lcl-fastapi/issues"

[project.scripts]
lcl-fastapi = "lcl_fastapi.cli.main:main"

[project.optional-dependencies]
docs = ["mkdocs==1.6.1"]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7.10,<8",
  "hatchling>=1.27,<2",
  "httpx>=0.28,<1",
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
  "types-psutil>=7.2,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lcl_fastapi"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/docs", "/examples", "/README.md", "/LICENSE", "/CHANGELOG.md", "/AGENTS.md", "/pyproject.toml", "/mkdocs.yml"]
exclude = ["**/__pycache__", "**/*.pyc", "**/.pytest_cache", "**/pytest-cache-files-*", "**/run", "**/logs", "**/.venv", "**/venv"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = ["src", "examples/directory_monitor", "examples/playground"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["examples/directory_monitor", "examples/playground"]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: starts real local service processes",
  "windows: behavior requiring Windows",
  "linux: behavior requiring Linux",
  "documentation: executes canonical documentation examples",
]

[tool.coverage.run]
branch = true
source = ["lcl_fastapi"]
relative_files = true
parallel = true
patch = ["subprocess", "_exit"]
concurrency = ["thread", "multiprocessing"]
sigterm = true

[tool.coverage.paths]
source = ["src/lcl_fastapi", "*/src/lcl_fastapi"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_lines = []

[tool.coverage.xml]
output = "reports/coverage.xml"

[tool.coverage.html]
directory = "reports/htmlcov"
